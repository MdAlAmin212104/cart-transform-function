# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a2916d511dd3ec278375de560ce70aff"
name = "cart-transform"
application_url = "https://cart-transforms.up.railway.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_cart_transforms,write_cart_transforms,write_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [
  "https://cart-transforms.up.railway.app/auth/callback",
  "https://cart-transforms.up.railway.app/auth/shopify/callback",
  "https://cart-transforms.up.railway.app/api/auth"
]

[app_proxy]
url = "/api/proxy"
subpath = "saved-cart"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
